@if (consent.showBanner()) {
  <div
    class="cookie-consent"
    role="dialog"
    aria-modal="false"
    aria-labelledby="cookie-consent-title"
    aria-describedby="cookie-consent-desc"
  >
    <div class="cookie-consent__inner">
      <div class="cookie-consent__copy">
        <p id="cookie-consent-title" class="cookie-consent__title">
          {{ 'consent.title' | transloco }}
        </p>
        <p id="cookie-consent-desc" class="cookie-consent__text">
          {{ 'consent.body' | transloco }}
          <a [routerLink]="['/', locale.activeLang(), 'privacy']">
            {{ 'nav.privacy' | transloco }}
          </a>
        </p>
      </div>
      <div class="cookie-consent__actions">
        <button type="button" appUiButton variant="ghost" (click)="acceptEssential()">
          {{ 'consent.essential' | transloco }}
        </button>
        <button type="button" appUiButton variant="primary" (click)="acceptAll()">
          {{ 'consent.acceptAll' | transloco }}
        </button>
      </div>
    </div>
  </div>
}
