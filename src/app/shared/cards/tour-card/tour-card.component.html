<article class="tour-card" [class.tour-card--list]="layout() === 'list'">
  <a class="tour-card__media" [routerLink]="['/', lang(), detailPath(), tour().slug]">
    <img
      [ngSrc]="hero().src"
      [alt]="hero().alt"
      [title]="hero().title || tour().title"
      width="600"
      height="400"
      loading="lazy"
    />
    <div class="tour-card__media-veil" aria-hidden="true"></div>
    @if (badgeList().length) {
      <ul class="tour-card__badges">
        @for (badge of badgeList().slice(0, 1); track badge) {
          <li>
            <app-ui-badge tone="accent">{{ badge }}</app-ui-badge>
          </li>
        }
      </ul>
    }
    <span class="tour-card__duration">{{ tour().duration }}</span>
    <div class="tour-card__actions" aria-label="Tour actions">
      <button type="button" (click)="onQuickView($event)">Quick View</button>
      <button type="button" (click)="toggleCompare($event)" [attr.aria-pressed]="isCompared()">
        {{ isCompared() ? 'Compared' : 'Compare' }}
      </button>
      <button type="button" (click)="toggleWishlist($event)" [attr.aria-pressed]="isWishlisted()">
        {{ isWishlisted() ? 'Saved' : 'Wishlist' }}
      </button>
    </div>
  </a>

  <div class="tour-card__body">
    <p class="tour-card__style">{{ tour().travelStyle }}</p>
    <h3 class="tour-card__title">
      <a [routerLink]="['/', lang(), detailPath(), tour().slug]">{{ tour().title }}</a>
    </h3>

    <div class="tour-card__offer">
      <p class="tour-card__price">
        <span class="tour-card__price-label">From</span>
        <strong>{{ fromPrice() | currency: tour().currency : 'symbol' : '1.0-0' }}</strong>
        <span class="tour-card__price-unit">/ person</span>
      </p>
      <p class="tour-card__perks">
        <span>Free cancellation</span>
        <span>Pay at destination</span>
      </p>
    </div>
  </div>
</article>
