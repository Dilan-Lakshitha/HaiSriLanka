<app-form-field [label]="label()" [forId]="forId()">
  <select
    [id]="forId()"
    [value]="value"
    [disabled]="disabled"
    (change)="onSelect($event)"
    (blur)="onTouched()"
  >
    @for (opt of options(); track opt.value) {
      <option [value]="opt.value">{{ opt.label }}</option>
    }
  </select>
</app-form-field>
