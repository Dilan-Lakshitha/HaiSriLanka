<section class="reviews" aria-labelledby="reviews-title" appReveal>
  <app-ui-container>
    <header class="reviews__header">
      <div>
        <p class="reviews__eyebrow">{{ intro().eyebrow }}</p>
        <h2 id="reviews-title">{{ intro().title }}</h2>
        <p>{{ intro().subtitle }}</p>
      </div>
      @if (intro().viewAllPath && intro().viewAllLabel) {
        <a appUiButton variant="ghost" [routerLink]="['/', lang(), intro().viewAllPath]">
          {{ intro().viewAllLabel }}
        </a>
      }
    </header>
    <div class="reviews__list">
      @for (review of reviews(); track trackById($index, review)) {
        <app-review-card [review]="review" />
      }
    </div>
  </app-ui-container>
</section>
