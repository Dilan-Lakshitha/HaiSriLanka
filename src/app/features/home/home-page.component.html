<div class="home-page">
  @if (homeVm$ | async; as home) {
    <app-hero-section [hero]="home.content.hero" [lang]="home.lang" />

    <!-- Content-only sections: paint immediately from seeded home.json (LCP-critical). -->
    <app-why-choose
      [intro]="home.content.whyChoose"
      [items]="home.content.whyChoose.items"
    />
    <app-tour-categories
      [intro]="home.content.tourCategories"
      [items]="home.content.tourCategories.items"
      [lang]="home.lang"
    />

    @if (catalogsVm$ | async; as catalogs) {
      <app-featured-tours
        [intro]="home.content.featuredMultiDay"
        [tours]="catalogs.multiDay"
        [lang]="catalogs.lang"
        detailPath="multi-day-tour"
      />
      <app-featured-tours
        [intro]="home.content.featuredDay"
        [tours]="catalogs.dayTours"
        [lang]="catalogs.lang"
        detailPath="day-tour"
      />
      <app-destinations-preview
        [intro]="home.content.destinations"
        [destinations]="catalogs.destinations"
        [lang]="catalogs.lang"
      />
      <app-map-section [map]="home.content.map" />
      <app-reviews-preview
        [intro]="home.content.reviews"
        [reviews]="catalogs.reviews"
        [lang]="catalogs.lang"
      />
      <app-travel-stats
        [eyebrow]="home.content.stats.eyebrow"
        [title]="home.content.stats.title"
        [items]="home.content.stats.items"
      />
      <app-blog-preview
        [intro]="home.content.blog"
        [posts]="catalogs.posts"
        [lang]="catalogs.lang"
      />
      <app-faq-preview
        [intro]="home.content.faq"
        [items]="catalogs.faqs"
        [lang]="catalogs.lang"
      />
      <app-home-cta [cta]="home.content.cta" [lang]="home.lang" />
    }
  } @else {
    <section class="home-page__hero-slot" aria-hidden="true"></section>
    <div class="home-page__rest-slot" aria-hidden="true">
      <div class="home-page__rest-block"></div>
      <div class="home-page__rest-block home-page__rest-block--tall"></div>
    </div>
  }
</div>
