<section class="tour-hero">
  <div class="tour-hero__media" aria-hidden="true">
    <img
      [ngSrc]="tour().heroImage?.src || tour().images[0].src"
      [alt]="tour().heroImage?.alt || tour().images[0].alt"
      [title]="tour().heroImage?.title || tour().title"
      [width]="tour().heroImage?.width || tour().images[0].width || 1600"
      [height]="tour().heroImage?.height || tour().images[0].height || 1067"
      priority
    />
    <div class="tour-hero__veil"></div>
  </div>
  <app-ui-container>
    <div class="tour-hero__content">
      <p class="tour-hero__eyebrow">{{ tour().duration }} · {{ tour().travelStyle || tour().location.name }}</p>
      <h1>{{ tour().title }}</h1>
      <p class="tour-hero__lead">{{ tour().shortDescription }}</p>
      <p class="tour-hero__price">
        From
        {{ fromPrice() | currency: tour().currency : 'symbol' : '1.0-0' }}
        <span>per person</span>
      </p>
      <div class="tour-hero__actions">
        <a appUiButton variant="primary" href="#tour-booking">Book Now</a>
        @if (galleryCount() > 0) {
          <button type="button" class="tour-hero__gallery" (click)="openGallery.emit()">
            Gallery ({{ galleryCount() }} Photos)
          </button>
        }
        <a
          appUiButton
          variant="ghost"
          [routerLink]="['/', lang(), tour().category === 'day' ? 'day-tours' : 'multi-day-tours']"
        >
          All tours
        </a>
      </div>
    </div>
  </app-ui-container>
</section>
