<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Hai Sri Lanka Tours</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b3d2e" />
    <meta name="description" content="Premium inbound tourism experiences across Sri Lanka with Hai Sri Lanka Tours." />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" href="favicon.png" />
    <link rel="manifest" href="site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://www.googletagmanager.com" />
    <link
      rel="preload"
      as="image"
      href="/assets/images/hero/carousel-king-coconut.webp"
      type="image/webp"
      fetchpriority="high"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=optional"
      rel="stylesheet"
    />
    <!-- Reserve consent-banner space before first paint (avoids CLS 0.1+). -->
    <script>
      (function () {
        try {
          if (!localStorage.getItem('hsl_consent_v2')) {
            document.documentElement.classList.add('consent-pending');
          }
        } catch (e) {
          document.documentElement.classList.add('consent-pending');
        }
      })();
    </script>
    <style>
      html.consent-pending {
        --consent-banner-h: 7.25rem;
      }
      @media (max-width: 640px) {
        html.consent-pending {
          --consent-banner-h: 10.5rem;
        }
      }
      html.consent-pending body {
        padding-bottom: var(--consent-banner-h);
      }
      #consent-banner-shell {
        display: none;
        position: fixed;
        inset: auto 0 0;
        z-index: 199;
        box-sizing: border-box;
        min-height: var(--consent-banner-h, 7.25rem);
        background: #0f2744;
        border-top: 1px solid rgba(201, 162, 39, 0.35);
      }
      html.consent-pending:not(.consent-hydrated) #consent-banner-shell {
        display: block;
      }
    </style>
    <!-- Consent Mode v2 defaults BEFORE Google tag (order is required). -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag('consent', 'default', {
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        analytics_storage: 'denied',
        wait_for_update: 500,
      });
      gtag('set', 'ads_data_redaction', true);
      gtag('set', 'url_passthrough', true);
      try {
        var stored = localStorage.getItem('hsl_consent_v2');
        if (stored) {
          var c = JSON.parse(stored);
          gtag('consent', 'update', {
            ad_storage: c.ad_storage || 'denied',
            ad_user_data: c.ad_user_data || 'denied',
            ad_personalization: c.ad_personalization || 'denied',
            analytics_storage: c.analytics_storage || 'denied',
          });
        }
      } catch (e) {
        /* ignore */
      }
    </script>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-T3GGHR933Z"></script>
    <script>
      gtag('js', new Date());
      gtag('config', 'G-T3GGHR933Z', { send_page_view: false, anonymize_ip: true });
    </script>
  </head>
  <body>
    <div id="consent-banner-shell" aria-hidden="true"></div>
    <app-root></app-root>
  </body>
</html>
