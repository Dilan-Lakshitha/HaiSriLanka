<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Hai Sri Lanka Tours</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b3d2e" />
    <meta
      name="description"
      content="Premium inbound tourism experiences across Sri Lanka with Hai Sri Lanka Tours."
    />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" href="favicon.png" />
    <link rel="manifest" href="site.webmanifest" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://www.googletagmanager.com" />
    <link
      rel="preload"
      as="image"
      href="/assets/images/hero/carousel-king-coconut.webp"
      type="image/webp"
      fetchpriority="high"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=optional"
      rel="stylesheet"
    />
    <!-- First-paint consent banner: present before Angular boots (avoids CLS ~0.1). -->
    <script>
      (function () {
        try {
          if (!localStorage.getItem('hsl_consent_v2')) {
            document.documentElement.classList.add('consent-pending');
          }
        } catch (e) {
          document.documentElement.classList.add('consent-pending');
        }
      })();
    </script>
    <style>
      html.consent-pending {
        --consent-banner-h: 7.5rem;
      }
      @media (max-width: 640px) {
        html.consent-pending {
          --consent-banner-h: 11.5rem;
        }
      }
      html.consent-pending body {
        padding-bottom: var(--consent-banner-h);
      }
      #hsl-consent-banner {
        display: none;
        position: fixed;
        inset: auto 0 0;
        z-index: 200;
        box-sizing: border-box;
        min-height: var(--consent-banner-h, 7.5rem);
        padding: 0.85rem 0.85rem calc(0.85rem + env(safe-area-inset-bottom, 0px));
        background: #0f2744;
        color: #f5f0e6;
        border-top: 1px solid rgba(201, 162, 39, 0.35);
        box-shadow: 0 -12px 36px rgba(9, 24, 44, 0.28);
      }
      html.consent-pending #hsl-consent-banner {
        display: block;
      }
      #hsl-consent-banner .hsl-consent__inner {
        max-width: 72rem;
        margin: 0 auto;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
      }
      #hsl-consent-banner .hsl-consent__copy {
        flex: 1 1 16rem;
        min-width: 0;
      }
      #hsl-consent-banner .hsl-consent__title {
        margin: 0 0 0.35rem;
        font-family: Poppins, Arial, sans-serif;
        font-size: 1rem;
        font-weight: 700;
        color: #f5f0e6;
      }
      #hsl-consent-banner .hsl-consent__text {
        margin: 0;
        font-family: Poppins, Arial, sans-serif;
        font-size: 0.86rem;
        line-height: 1.5;
        opacity: 0.92;
        max-width: 52rem;
      }
      #hsl-consent-banner .hsl-consent__text a {
        color: #c9a227;
        text-decoration: underline;
        text-underline-offset: 2px;
      }
      #hsl-consent-banner .hsl-consent__actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        flex-shrink: 0;
      }
      #hsl-consent-banner .hsl-consent__btn {
        min-height: 44px;
        min-width: 44px;
        padding: 0.55rem 1rem;
        border-radius: 0.4rem;
        font-family: Poppins, Arial, sans-serif;
        font-size: 0.9rem;
        font-weight: 600;
        cursor: pointer;
        border: 1px solid transparent;
      }
      #hsl-consent-banner .hsl-consent__btn--ghost {
        background: transparent;
        color: #f5f0e6;
        border-color: rgba(245, 240, 230, 0.35);
      }
      #hsl-consent-banner .hsl-consent__btn--primary {
        background: #0b3d2e;
        color: #f5f0e6;
        border-color: #c9a227;
      }
      /* Static LCP hero: paints before Angular boots (cuts ~2s element render delay).
         Angular then moves this <img> into .hero__media (same node — stays sharp). */
      #hsl-lcp-hero {
        display: none;
        position: fixed;
        inset: 0 0 auto;
        z-index: 0;
        width: 100%;
        height: 78vh;
        height: 78dvh;
        min-height: 32rem;
        max-height: 56rem;
        overflow: hidden;
        pointer-events: none;
        background: #0f2744;
      }
      html.hsl-home #hsl-lcp-hero {
        display: block;
      }
      #hsl-lcp-hero img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
      }
      @media (max-width: 768px) {
        #hsl-lcp-hero {
          height: 62svh;
          min-height: 24rem;
          max-height: none;
        }
      }
      app-root {
        position: relative;
        z-index: 1;
      }
    </style>
    <!-- Consent Mode v2 defaults BEFORE Google tag (order is required). -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag('consent', 'default', {
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        analytics_storage: 'denied',
        wait_for_update: 500,
      });
      gtag('set', 'ads_data_redaction', true);
      gtag('set', 'url_passthrough', true);
      try {
        var stored = localStorage.getItem('hsl_consent_v2');
        if (stored) {
          var c = JSON.parse(stored);
          gtag('consent', 'update', {
            ad_storage: c.ad_storage || 'denied',
            ad_user_data: c.ad_user_data || 'denied',
            ad_personalization: c.ad_personalization || 'denied',
            analytics_storage: c.analytics_storage || 'denied',
          });
        }
      } catch (e) {
        /* ignore */
      }
    </script>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-T3GGHR933Z"></script>
    <script>
      gtag('js', new Date());
      gtag('config', 'G-T3GGHR933Z', { send_page_view: false, anonymize_ip: true });
    </script>
  </head>
  <body>
    <!--
      Homepage LCP image in the first HTML so Chrome can paint it without waiting
      for Angular bootstrap (PSI "element render delay").
    -->
    <div id="hsl-lcp-hero" aria-hidden="true">
      <img
        id="hsl-lcp-hero-img"
        src="/assets/images/hero/carousel-king-coconut.webp"
        alt=""
        width="1024"
        height="768"
        decoding="async"
        fetchpriority="high"
      />
    </div>
    <script>
      (function () {
        var path = (location.pathname || '/').replace(/\/+$/, '') || '/';
        // Home: /, /en, /sv, etc. (single locale segment only)
        if (path === '/' || /^\/[a-z]{2}$/i.test(path)) {
          document.documentElement.classList.add('hsl-home');
        } else {
          var shell = document.getElementById('hsl-lcp-hero');
          if (shell) shell.remove();
        }
      })();
    </script>
    <div
      id="hsl-consent-banner"
      role="dialog"
      aria-modal="false"
      aria-labelledby="hsl-consent-title"
      aria-describedby="hsl-consent-desc"
    >
      <div class="hsl-consent__inner">
        <div class="hsl-consent__copy">
          <p id="hsl-consent-title" class="hsl-consent__title" data-i18n="title">
            Cookies &amp; privacy
          </p>
          <p id="hsl-consent-desc" class="hsl-consent__text">
            <span data-i18n="body"
              >We use cookies for analytics and to improve your experience. You can accept all
              cookies or continue with essential only.</span
            >
            <a data-i18n="privacy" href="/en/privacy">Privacy Policy</a>
          </p>
        </div>
        <div class="hsl-consent__actions">
          <button
            type="button"
            class="hsl-consent__btn hsl-consent__btn--ghost"
            data-consent="essential"
            data-i18n="essential"
          >
            Essential only
          </button>
          <button
            type="button"
            class="hsl-consent__btn hsl-consent__btn--primary"
            data-consent="all"
            data-i18n="acceptAll"
          >
            Accept all
          </button>
        </div>
      </div>
    </div>
    <app-root></app-root>
  </body>
</html>
